version: v2
description: Owned H200 trainer, sixteen TP4 DCP2 mixed GPU replicas, four TP1 H200
  replicas, 2x oversampling, per-rollout affinity and parallel LiteCast transfers
tasks:
- name: head
  replicas: 1
  image:
    beaker: litecast-runtime
  command:
  - bash
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/runtime-cache.sh
  - head
  resources:
    gpuCount: 0
    cpuCount: 4
    memory: 16 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: UV_PROJECT_ENVIRONMENT
    value: /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src:/gscratch/ark/graf/primebeaker/src:/gscratch/ark/graf/literegistry-core/literegistry_tool_client/src
  - name: LITECAST_MODEL_CACHE
    value: /tmp/litecast-hf
  - name: GATEWAY_REGISTRATION_ENABLED
    value: 'false'
  - name: REGISTRY_CACHE_TTL_SECONDS
    value: '0'
  - name: LITECAST_REQUIRE_MIDDLE
    value: '0'
  - name: LITECAST_CAPACITY_ENABLED
    value: '1'
  - name: LITECAST_TRAIN_CONFIG
    value: /mmfs1/gscratch/ark/graf/prime-rl-shardcast/examples/litecast-rubrics/train-h200-owned-oversample2.toml
  - name: LITECAST_INFERENCE_CONFIG
    value: /mmfs1/gscratch/ark/graf/prime-rl-shardcast/examples/litecast-rubrics/inference-tp4-dcp2.toml
  - name: LITECAST_CAPACITY_CONFIG
    value: /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-rubrics/capacity.toml
  - name: LITECAST_MODEL_SOURCE
    value: /gscratch/ark/graf/data/batchrubrics/models/sloth2b-sft-step400
  - name: LITECAST_DATASET_SOURCE
    value: /gscratch/ark/graf/data/batchrubrics/rl_datadev_7ef8249d31225b43/active-rl
  - name: LITECAST_MIN_MIDDLES
    value: '1'
  result:
    path: /tmp/litecast-result
- name: middle
  replicas: 8
  image:
    beaker: litecast-runtime
  command:
  - bash
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/runtime-cache.sh
  - middle
  resources:
    gpuCount: 0
    cpuCount: 16
    memory: 64 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
