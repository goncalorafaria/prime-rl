rexs:
  allocations:
  - name: head
    tasks:
    - head
    profile: profile-klone-head.yaml
  - name: middle
    tasks:
    - middle
    profile: profile-klone-middle.yaml
    independent_replicas: true
  - name: trainer
    tasks:
    - trainer
    profile: profile-klone-h200-owned.yaml
  - name: inference
    tasks:
    - inference
    profile: profile-klone-inference-tp4-dcp4.yaml
    independent_replicas: true
  - name: inference-h200
    tasks:
    - inference-h200
    profile: profile-klone-inference-h200-tp1.yaml
    independent_replicas: true
  - name: terminal
    tasks:
    - terminal
    profile: profile-klone-terminal.yaml
    independent_replicas: true
  completion_task: trainer
  failure_policies:
    trainer:
      action: fail_experiment
    head:
      action: restart
      max_restarts: 10
    middle:
      action: restart
      max_restarts: 10
    inference:
      action: restart
      max_restarts: 10
    terminal:
      action: restart
      max_restarts: 10
    inference-h200:
      action: restart
      max_restarts: 10
