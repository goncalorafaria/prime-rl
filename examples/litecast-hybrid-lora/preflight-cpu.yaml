version: v2
description: Klone rubric environment and local dataset preflight
tasks:
- name: preflight
  replicas: 1
  image:
    beaker: litecast-runtime
  command:
  - bash
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/runtime-cache.sh
  - check
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-hybrid-lora/check_cpu.py
  resources:
    gpuCount: 0
    cpuCount: 4
    memory: 16 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars: []
  result:
    path: /tmp/litecast-result
rexs:
  allocations:
  - name: preflight
    tasks:
    - preflight
    profile: ../litecast-rubrics/profile-klone-head.yaml
  completion_task: preflight
  failure_policies:
    preflight:
      action: fail_experiment
