rexs:
  allocations:
  - name: head
    tasks:
    - head
    profile: profile-klone-head.yaml
  - name: middle
    tasks:
    - middle
    profile: profile-klone-middle.yaml
    independent_replicas: true
  - name: trainer
    tasks:
    - trainer
    profile: profile-klone-h200-owned.yaml
  - name: judge
    tasks:
    - judge
    profile: profile-klone-judge.yaml
    independent_replicas: true
  - name: inference
    tasks:
    - inference
    profile: profile-klone-inference-tp1.yaml
    independent_replicas: true
  - name: judge-api
    tasks:
    - judge-api
    profile: profile-klone-judge-api.yaml
  - name: terminal
    tasks:
    - terminal
    profile: profile-klone-terminal.yaml
    independent_replicas: true
  completion_task: trainer
  failure_policies:
    trainer:
      action: fail_experiment
    head:
      action: restart
      max_restarts: null
    middle:
      action: restart
      max_restarts: null
    inference:
      action: restart
      max_restarts: null
    judge:
      action: restart
      max_restarts: null
    terminal:
      action: restart
      max_restarts: null
    judge-api:
      action: restart
      max_restarts: null
