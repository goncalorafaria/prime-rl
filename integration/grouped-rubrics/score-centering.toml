# Replace trainer.loss in your complete config with this table; merge other tables.
# Remove IPO-only eps/kl_tau fields when switching from overrides.toml.
[trainer.loss]
type = "icepop"
ratio_low = 0.2 # Upstream defaults; used for both sampled and centering masks.
ratio_high = 5.0
aggregation = "group_token_mean"
score_centering = true

[trainer.model]
fused_lm_head_token_chunk_size = "disabled"

[orchestrator.train.sampling]
score_centering_top_k = 128

[inference.vllm]
logprobs_mode = "processed_logprobs"
max_logprobs = 128
