version: v2
description: TP4 retained-state LoRA and prefix sharing validation through LiteRegistry
tasks:
- name: preflight
  image:
    beaker: litecast-runtime
  command:
  - bash
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/runtime-cache.sh
  - check
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-hybrid-lora/preflight.py
  resources:
    gpuCount: 4
    cpuCount: 32
    memory: 192 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src
  - name: OMP_NUM_THREADS
    value: '4'
  - name: PRIME_RL_HYBRID_LORA
    value: '1'
  - name: LITECAST_CHECK_INFERENCE_CONFIG
    value: /mmfs1/gscratch/ark/graf/prime-rl-shardcast/examples/litecast-rubrics/inference-tp4-dcp2.toml
  - name: LITECAST_CHECK_OUTPUT_TOKENS
    value: '1024'
  result:
    path: /tmp/litecast-result
rexs:
  allocations:
  - name: preflight
    tasks:
    - preflight
    profile: ../litecast-rubrics/profile-klone-inference-tp4-dcp4.yaml
  completion_task: preflight
  failure_policies:
    preflight:
      action: fail_experiment
