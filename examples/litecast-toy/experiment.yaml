version: v2
description: Three-step Qwen3.5-2B reverse-text LoRA training through two LiteCast
  CPU middles
tasks:
- name: head
  replicas: 1
  image:
    beaker: litecast-runtime
  command:
  - uv
  - run
  - --no-project
  - --python
  - /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host/bin/python
  - python
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/role.py
  - head
  resources:
    gpuCount: 0
    cpuCount: 2
    memory: 8 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: UV_PROJECT_ENVIRONMENT
    value: /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src
  - name: HF_HOME
    value: /tmp/litecast-hf
  - name: GATEWAY_REGISTRATION_ENABLED
    value: 'false'
  - name: REGISTRY_CACHE_TTL_SECONDS
    value: '0'
  result:
    path: /tmp/litecast-result
- name: middle
  replicas: 2
  image:
    beaker: litecast-runtime
  command:
  - uv
  - run
  - --no-project
  - --python
  - /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host/bin/python
  - python
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/role.py
  - middle
  resources:
    gpuCount: 0
    cpuCount: 2
    memory: 8 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: UV_PROJECT_ENVIRONMENT
    value: /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src
  - name: HF_HOME
    value: /tmp/litecast-hf
  - name: GATEWAY_REGISTRATION_ENABLED
    value: 'false'
  - name: REGISTRY_CACHE_TTL_SECONDS
    value: '0'
  result:
    path: /tmp/litecast-result
- name: trainer
  replicas: 1
  image:
    beaker: litecast-runtime
  command:
  - uv
  - run
  - --no-project
  - --python
  - /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host/bin/python
  - python
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/role.py
  - trainer
  resources:
    gpuCount: 1
    cpuCount: 8
    memory: 64 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: UV_PROJECT_ENVIRONMENT
    value: /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src
  - name: HF_HOME
    value: /tmp/litecast-hf
  - name: GATEWAY_REGISTRATION_ENABLED
    value: 'false'
  - name: REGISTRY_CACHE_TTL_SECONDS
    value: '0'
  result:
    path: /tmp/litecast-result
- name: inference
  replicas: 1
  image:
    beaker: litecast-runtime
  command:
  - uv
  - run
  - --no-project
  - --python
  - /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host/bin/python
  - python
  - /gscratch/ark/graf/prime-rl-shardcast/examples/litecast-toy/role.py
  - inference
  resources:
    gpuCount: 1
    cpuCount: 8
    memory: 64 GiB
  datasets:
  - mountPath: /gscratch/ark/graf
    source:
      hostPath: /gscratch/ark/graf
  envVars:
  - name: UV_PROJECT_ENVIRONMENT
    value: /gscratch/ark/graf/prime-rl-shardcast/outputs/toy-runtime-host
  - name: PYTHONPATH
    value: /gscratch/ark/graf/prime-rl-shardcast/src
  - name: HF_HOME
    value: /tmp/litecast-hf
  - name: GATEWAY_REGISTRATION_ENABLED
    value: 'false'
  - name: REGISTRY_CACHE_TTL_SECONDS
    value: '0'
  result:
    path: /tmp/litecast-result
rexs:
  allocations:
  - name: head
    tasks:
    - head
    profile: profile-cpu.yaml
  - name: middle
    tasks:
    - middle
    profile: profile-cpu.yaml
    independent_replicas: true
  - name: trainer
    tasks:
    - trainer
    profile: profile-a40.yaml
  - name: inference
    tasks:
    - inference
    profile: profile-a40.yaml
  completion_task: trainer
  failure_policies:
    head:
      action: fail_experiment
    middle:
      action: fail_experiment
    inference:
      action: fail_experiment
