[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "build",
]
build-backend = "setuptools.build_meta"

[project]
name = "litecast"
dynamic = ["version"]
description = "Distribute large files via HTTP with an optional UCXX RDMA data plane"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "P2P Weight Transfer", email = "felix@primeintellect.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["blake3>=1.0.5"]

[project.scripts]
litecast-origin = "litecast.origin_server:main"
litecast-middle = "litecast.middle_node:main"
litecast-client = "litecast.client_node:main"

[tool.setuptools.dynamic]
version = {attr = "litecast.__version__"}

[tool.ruff]
line-length = 140
"ignore" = ["F841"]

[tool.uv]
dev-dependencies = ["ruff>=0.5.0", "pre-commit>=3.0.0", "pytest>=7.0.0", "faker", "torch", "numpy"]

[tool.uv.sources]
litecast = { path = "litecast", editable = true }
