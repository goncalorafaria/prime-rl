router = "None"
enable_lora = true
max_loras = 8
max_cpu_loras = 8
max_lora_rank = 32
lora_target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]
gpu_memory_utilization = 0.8
enable_prefix_caching = true

[server]
host = "127.0.0.1"
port = 8000

[model]
enforce_eager = true
name = "/tmp/litecast-rubrics/models/sloth2b-sft-step400"
max_model_len = 65536
dtype = "bfloat16"
trust_remote_code = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[parallel]
tp = 2
dp = 1

[vllm_extra]
decode_context_parallel_size = 1
language_model_only = true
max_num_batched_tokens = 8192
max_num_seqs = 64
enable_chunked_prefill = true

[env_vars]
VLLM_ALLOW_RUNTIME_LORA_UPDATING = "1"
